[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-payments-api"
version = "0.1.0"
description = "A local API for claims and payment records"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "uvicorn>=0.32,<1",
]

[tool.setuptools.packages.find]
include = ["claims_api*"]
